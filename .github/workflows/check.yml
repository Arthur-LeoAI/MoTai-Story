name: Check

on:
  # Run on every branch push (work happens on feature branches, not only main)
  # and on pull requests into the integration branches.
  push:
    branches: ["**"]
  pull_request:
    branches: [main, jiamingli]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm run check

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: pnpm run test:e2e
